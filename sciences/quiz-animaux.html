<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz des animaux / Animal quiz</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,Arial,sans-serif;color:#2b2d42;background:#bfeaff;background-image:radial-gradient(circle at 12% 18%,#fff8 0 60px,transparent 62px),radial-gradient(circle at 85% 12%,#fff8 0 80px,transparent 82px),radial-gradient(circle at 70% 85%,#ffe66d66 0 120px,transparent 122px);background-attachment:fixed;-webkit-user-select:none;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;max-width:900px;margin:0 auto}
.hr{display:flex;gap:8px}
.btn{font:inherit;font-weight:700;font-size:clamp(16px,3.6vw,20px);border:0;border-radius:18px;padding:12px 18px;min-height:52px;cursor:pointer;color:#fff;background:#6c5ce7;box-shadow:0 5px 0 #4b3fb3;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #4b3fb3}
.btn.small{min-height:48px;padding:8px 14px;font-size:16px}
.btn.quit{background:#ef476f;box-shadow:0 5px 0 #b02a4a}
.btn.quit:active{box-shadow:0 1px 0 #b02a4a}
.btn.light{background:#fff;color:#2b2d42;box-shadow:0 5px 0 #b9c6d3}
.btn.light:active{box-shadow:0 1px 0 #b9c6d3}
.btn.big{font-size:clamp(20px,5vw,28px);padding:18px 28px;min-height:72px}
.btn.green{background:#06b57a;box-shadow:0 5px 0 #048057}
.btn.green:active{box-shadow:0 1px 0 #048057}
main{max-width:900px;margin:0 auto;padding:6px 12px 30px}
.card{background:#fff;border-radius:30px;padding:clamp(16px,4vw,32px);box-shadow:0 10px 0 #9ccfe8,0 18px 30px #0002;text-align:center;position:relative;overflow:hidden}
h1{font-size:clamp(28px,7vw,52px);margin:6px 0 4px;color:#ef476f}
h2{font-size:clamp(22px,5vw,34px);margin:8px 0}
p{font-size:clamp(17px,3.8vw,22px);line-height:1.4;margin:8px 0}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:18px}
.langs .btn{flex-direction:column;min-height:130px;font-size:clamp(24px,6vw,34px)}
.langs .btn span.sm{font-size:16px;font-weight:400}
.animal{font-size:clamp(80px,22vw,140px);line-height:1.1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.dot{width:16px;height:16px;border-radius:50%;background:#dfe7ee}
.dot.now{background:#ffb703;transform:scale(1.3)}
.dot.ok{background:#06b57a}
.dot.ko{background:#ef476f}
.q{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.q p{font-size:clamp(20px,5vw,30px);font-weight:700;margin:6px 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:14px}
.opt{font:inherit;border:0;border-radius:22px;padding:16px 12px;min-height:96px;cursor:pointer;color:#fff;font-weight:700;font-size:clamp(20px,5vw,28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.22);transition:transform .08s}
.opt:nth-child(1){background:#ff8c42}
.opt:nth-child(2){background:#2ec4b6}
.opt:nth-child(3){background:#a06cd5}
.opt:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.opt .e{font-size:clamp(34px,9vw,52px);line-height:1}
.opt .s{font-size:clamp(14px,3.4vw,17px);font-weight:400}
.opt.right{background:#06b57a!important;outline:6px solid #b8f2dc}
.opt.wrong{background:#ef476f!important;animation:shake .45s}
.opt.off{pointer-events:none;opacity:.55}
.opt.right.off{opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.fb{margin-top:18px;border-radius:22px;padding:14px 16px;font-size:clamp(18px,4.2vw,24px);font-weight:700}
.fb.good{background:#d8f8ea;color:#04694a}
.fb.bad{background:#ffe0e8;color:#9a1d3b}
.fb .fact{display:block;margin-top:8px;font-weight:400;color:#2b2d42;font-size:clamp(16px,3.8vw,20px)}
.intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.intro div{border-radius:20px;padding:14px;background:#fff4d6}
.intro .e{font-size:54px;display:block}
.intro b{font-size:clamp(20px,5vw,26px);display:block}
.score{font-size:clamp(56px,16vw,110px);font-weight:900;color:#6c5ce7;margin:0}
.stars{font-size:clamp(34px,9vw,56px);letter-spacing:6px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.note{font-size:14px;color:#6b7a89;margin-top:10px}
.conf{position:fixed;top:-60px;font-size:30px;z-index:50;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.animal,.opt.wrong{animation:none}.conf{display:none}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<noscript><p style="text-align:center">JavaScript is needed / JavaScript est nécessaire.</p></noscript>

<script src="animaux-perso.js" onerror="void 0"></script>
<script>
"use strict";
/* ---------- Nombres en lettres (français de Belgique + anglais) ---------- */
function wFr(n){
  var u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
  var t=['','','vingt','trente','quarante','cinquante','soixante','septante','quatre-vingt','nonante'];
  if(n<=16)return u[n];
  if(n<20)return 'dix-'+u[n-10];
  if(n===100)return 'cent';
  if(n>100)return String(n);
  var d=Math.floor(n/10),r=n%10;
  if(r===0)return d===8?'quatre-vingts':t[d];
  if(r===1&&d!==8)return t[d]+' et un';
  return t[d]+'-'+u[r];
}
function wEn(n){
  var o=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  var t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  if(n<20)return o[n];
  if(n<100)return t[Math.floor(n/10)]+(n%10?'-'+o[n%10]:'');
  if(n===100)return 'one hundred';
  return String(n);
}
function words(n){return lang==='fr'?wFr(n):wEn(n)}
function written(s){return s.replace(/\{(\d+)\}/g,function(m,n){return n+' ('+words(+n)+')'})}
function spoken(s){return s.replace(/\{(\d+)\}/g,function(m,n){return words(+n)})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

/* ---------- Données ---------- */
var FOODS={
 herbe:{e:'🌾',t:'p',fr:"de l'herbe",en:'grass'},
 foin:{e:'🌾',t:'p',fr:'du foin',en:'hay'},
 carottes:{e:'🥕',t:'p',fr:'des carottes',en:'carrots'},
 bambou:{e:'🎍',t:'p',fr:'du bambou',en:'bamboo'},
 feuilles:{e:'🍃',t:'p',fr:'des feuilles',en:'leaves'},
 noisettes:{e:'🌰',t:'p',fr:'des noisettes',en:'nuts'},
 viande:{e:'🥩',t:'m',fr:'de la viande',en:'meat'},
 poisson:{e:'🐟',t:'m',fr:'du poisson',en:'fish'},
 souris:{e:'🐭',t:'m',fr:'des souris',en:'mice'},
 insectes:{e:'🐛',t:'m',fr:'des insectes',en:'insects'}
};
var DIETS={
 carn:{e:'🥩',fr:'carnivore',en:'carnivore',art:'a',sfr:'mange de la viande',sen:'eats meat'},
 herb:{e:'🌿',fr:'herbivore',en:'herbivore',art:'a',sfr:'mange des plantes',sen:'eats plants'},
 omn:{e:'🍽️',fr:'omnivore',en:'omnivore',art:'an',sfr:'mange de tout',sen:'eats everything'}
};
var ANIMALS=[
 {e:'🐄',grp:'herb',diet:'herb',food:'herbe',fr:'la vache',frDe:'de la vache',en:'the cow',
  fact:{fr:"Une vache peut boire {80} litres d'eau par jour !",en:'A cow can drink {80} litres of water a day!'}},
 {e:'🐑',grp:'herb',diet:'herb',food:'herbe',fr:'le mouton',frDe:'du mouton',en:'the sheep'},
 {e:'🐴',grp:'herb',diet:'herb',food:'foin',fr:'le cheval',frDe:'du cheval',en:'the horse'},
 {e:'🐰',grp:'herb',diet:'herb',food:'carottes',fr:'le lapin',frDe:'du lapin',en:'the rabbit',
  fact:{fr:'Les dents du lapin poussent toute sa vie !',en:"A rabbit's teeth never stop growing!"}},
 {e:'🦒',grp:'herb',diet:'herb',food:'feuilles',fr:'la girafe',frDe:'de la girafe',en:'the giraffe',
  fact:{fr:'Une girafe peut mesurer {5} mètres de haut !',en:'A giraffe can be {5} metres tall!'}},
 {e:'🐼',grp:'herb',diet:'herb',food:'bambou',fr:'le panda',frDe:'du panda',en:'the panda',
  fact:{fr:'Il y a des pandas à Pairi Daiza, en Belgique !',en:'There are pandas at Pairi Daiza, in Belgium!'}},
 {e:'🦌',grp:'herb',diet:'herb',food:'feuilles',fr:'le cerf',frDe:'du cerf',en:'the deer',
  fact:{fr:'Tu peux voir des cerfs dans les forêts des Ardennes.',en:'You can see deer in the Ardennes forests.'}},
 {e:'🐿️',grp:'herb',food:'noisettes',fr:"l'écureuil",frDe:"de l'écureuil",en:'the squirrel',
  fact:{fr:"L'écureuil cache des noisettes pour l'hiver.",en:'The squirrel hides nuts for the winter.'}},
 {e:'🐺',grp:'carn',diet:'carn',food:'viande',fr:'le loup',frDe:'du loup',en:'the wolf',
  fact:{fr:'Les loups vivent en famille : une meute.',en:'Wolves live in a family called a pack.'}},
 {e:'🦁',grp:'carn',diet:'carn',food:'viande',fr:'le lion',frDe:'du lion',en:'the lion',
  fact:{fr:'Un lion peut dormir jusqu\'à {20} heures par jour !',en:'A lion can sleep up to {20} hours a day!'}},
 {e:'🐱',grp:'carn',diet:'carn',food:'souris',fr:'le chat',frDe:'du chat',en:'the cat',
  fact:{fr:'Un chat dort environ {16} heures par jour.',en:'A cat sleeps about {16} hours a day.'}},
 {e:'🦉',grp:'carn',diet:'carn',food:'souris',fr:'la chouette',frDe:'de la chouette',en:'the owl',
  fact:{fr:'La chouette chasse la nuit.',en:'The owl hunts at night.'}},
 {e:'🐸',grp:'carn',diet:'carn',food:'insectes',fr:'la grenouille',frDe:'de la grenouille',en:'the frog'},
 {e:'🦈',grp:'carn',diet:'carn',food:'poisson',fr:'le requin',frDe:'du requin',en:'the shark'},
 {e:'🐷',grp:'omn',diet:'omn',fr:'le cochon',frDe:'du cochon',en:'the pig'},
 {e:'🐔',grp:'omn',diet:'omn',fr:'la poule',frDe:'de la poule',en:'the hen',
  fact:{fr:'La poule mange des graines, mais aussi des vers !',en:'The hen eats seeds, but also worms!'}},
 {e:'🐗',grp:'omn',diet:'omn',fr:'le sanglier',frDe:'du sanglier',en:'the wild boar',
  fact:{fr:'Le sanglier vit dans les forêts de Belgique.',en:'The wild boar lives in the forests of Belgium.'}},
 {e:'🐻',grp:'omn',diet:'omn',fr:"l'ours",frDe:"de l'ours",en:'the bear',
  fact:{fr:"L'ours aime le miel, les fruits et le poisson.",en:'The bear likes honey, fruit and fish.'}},
 {e:'🦊',grp:'omn',diet:'omn',fr:'le renard',frDe:'du renard',en:'the fox',
  fact:{fr:'Le renard mange des fruits, des souris et des vers.',en:'The fox eats fruit, mice and worms.'}},
 {e:'🦆',grp:'omn',diet:'omn',fr:'le canard',frDe:'du canard',en:'the duck',
  fact:{fr:'Le canard adore les mares et les étangs.',en:'The duck loves ponds.'}},
 {e:'🧒',grp:'omn',diet:'omn',fr:"l'humain",frDe:"de l'humain",en:'the human',
  fact:{fr:'Toi aussi, tu manges de tout !',en:'You eat everything too!'}}
];

/* ---------- Animaux ajoutés avec l'éditeur (animaux-perso.js) ---------- */
if(window.ANIMAUX_PERSO&&ANIMAUX_PERSO.length){
  ANIMAUX_PERSO.forEach(function(p,i){
    if(!p||!p.e||!p.fr||!p.en||!DIETS[p.diet])return;
    var a={e:p.e,grp:p.diet,diet:p.diet,fr:p.fr,frDe:p.frDe||('de '+p.fr),en:p.en};
    if(p.fact&&p.fact.fr&&p.fact.en)a.fact=p.fact;
    if(p.food&&p.diet!=='omn'&&p.food.e&&p.food.fr&&p.food.en){
      var k='perso'+i;
      FOODS[k]={e:p.food.e,t:p.diet==='herb'?'p':'m',fr:p.food.fr,en:p.food.en};
      a.food=k;
    }
    ANIMALS.push(a);
  });
}

/* ---------- Textes de l'interface ---------- */
var T={
 fr:{title:'Le Quiz des Animaux',quit:'Quitter',langBtn:'Langue',snd:'Son',
  introSpeak:["Bienvenue !","Voici trois mots à connaître.","Carnivore : il mange de la viande.","Herbivore : il mange des plantes.","Omnivore : il mange de tout, des plantes et de la viande.","Prêt ? Appuie sur Jouer !"],
  introH:'Trois mots à connaître',play:'Jouer',
  qDiet:function(a){return 'Quel est le régime alimentaire '+a.frDe+' ?'},
  qFood:function(a){return 'Que mange '+a.fr+' ?'},
  praise:['Bravo !','Super !','Génial !','Excellent !','Bien joué !'],
  oops:"Oups ! Ce n'est pas ça.",right:'La bonne réponse :',
  next:'Suivant',last:'Voir mon score',replay:'Écouter',again:'Rejouer',
  dietSentence:function(a,d){return cap(a.fr)+' est '+DIETS[d].fr+'. Un '+DIETS[d].fr+' '+DIETS[d].sfr+'.'},
  foodSentence:function(a,f){return cap(a.fr)+' mange '+FOODS[f].fr+'.'},
  scoreLine:function(p){return 'Tu as '+wFr(p)+' points sur cent !'},
  end:['Continue, tu vas y arriver !','Très bien !','Champion des animaux !'],
  noVoice:"Pas de voix sur cet appareil : lis bien les textes."},
 en:{title:'The Animal Quiz',quit:'Quit',langBtn:'Language',snd:'Sound',
  introSpeak:["Welcome!","Here are three words to know.","Carnivore: it eats meat.","Herbivore: it eats plants.","Omnivore: it eats everything, plants and meat.","Ready? Press Play!"],
  introH:'Three words to know',play:'Play',
  qDiet:function(a){return 'What is the diet of '+a.en+'?'},
  qFood:function(a){return 'What does '+a.en+' eat?'},
  praise:['Well done!','Super!','Awesome!','Excellent!','Great job!'],
  oops:'Oops! Not quite.',right:'The right answer:',
  next:'Next',last:'See my score',replay:'Listen',again:'Play again',
  dietSentence:function(a,d){return cap(a.en)+' is '+DIETS[d].art+' '+DIETS[d].en+'. '+cap(DIETS[d].art)+' '+DIETS[d].en+' '+DIETS[d].sen+'.'},
  foodSentence:function(a,f){return cap(a.en)+' eats '+FOODS[f].en+'.'},
  scoreLine:function(p){return 'You got '+wEn(p)+' points out of one hundred!'},
  end:['Keep going, you can do it!','Very good!','Animal champion!'],
  noVoice:'No voice on this device: read the texts carefully.'}
};

/* ---------- Voix (à remplacer ici si besoin) ---------- */
var VOICE={
  ok:('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),
  voices:[],
  load:function(){if(this.ok)this.voices=speechSynthesis.getVoices()||[]},
  pick:function(l){
    var prefs=l==='fr'?['fr-be','fr-fr','fr-ca','fr-ch']:['en-gb','en-us','en-au','en-ie'];
    var vs=this.voices,i,j;
    for(i=0;i<prefs.length;i++)for(j=0;j<vs.length;j++)if(vs[j].lang.replace('_','-').toLowerCase()===prefs[i])return vs[j];
    for(j=0;j<vs.length;j++)if(vs[j].lang.toLowerCase().indexOf(l)===0)return vs[j];
    return null;
  },
  stop:function(){clearTimeout(this.t);if(this.ok)try{speechSynthesis.cancel()}catch(e){}},
  unlock:function(){if(this.ok)try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}},
  speak:function(list,l){
    if(!this.ok||!sound)return;
    var self=this;this.stop();
    this.t=setTimeout(function(){
      self.load();
      var v=self.pick(l);
      list.forEach(function(txt){
        var u=new SpeechSynthesisUtterance(txt);
        u.lang=l==='fr'?(v&&v.lang?v.lang.replace('_','-'):'fr-BE'):(v&&v.lang?v.lang.replace('_','-'):'en-GB');
        if(v)u.voice=v;
        u.rate=0.9;u.pitch=1.1;
        speechSynthesis.speak(u);
      });
    },60);
  }
};
VOICE.load();
if(VOICE.ok)speechSynthesis.onvoiceschanged=function(){VOICE.load()};
function say(list){VOICE.speak(list.map(spoken),lang)}

/* ---------- Petits sons et confettis ---------- */
var actx=null;
function beep(seq){
  if(!sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var t=actx.currentTime;
    seq.forEach(function(n,i){
      var o=actx.createOscillator(),g=actx.createGain();
      o.type='triangle';o.frequency.value=n;
      g.gain.setValueAtTime(0.15,t+i*0.12);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.12+0.2);
      o.connect(g);g.connect(actx.destination);o.start(t+i*0.12);o.stop(t+i*0.12+0.22);
    });
  }catch(e){}
}
function confetti(){
  var em=['🎉','⭐','✨','🎈','🌟'];
  for(var i=0;i<22;i++){
    var s=document.createElement('span');
    s.className='conf';s.textContent=em[i%em.length];
    s.style.left=(Math.random()*95)+'vw';
    s.style.animationDelay=(Math.random()*0.5)+'s';
    document.body.appendChild(s);
    (function(x){setTimeout(function(){x.remove()},2900)})(s);
  }
}

/* ---------- État ---------- */
var lang='fr',sound=true,Q=[],qi=0,pts=0,results=[],cur=null;
var app=document.getElementById('app'),hdr=document.getElementById('hdr');

function shuffle(a){return a.map(function(x){return [Math.random(),x]}).sort(function(p,q){return p[0]-q[0]}).map(function(x){return x[1]})}

function header(){
  var t=T[lang];
  hdr.innerHTML='<a class="btn quit small" id="quit" href="../index.html">✖ '+t.quit+'</a>'+
   '<div class="hr"><button class="btn light small" id="bLang" type="button">🌍 '+t.langBtn+'</button>'+
   (VOICE.ok?'<button class="btn light small" id="bSnd" type="button" aria-label="'+t.snd+'">'+(sound?'🔊':'🔇')+'</button>':'')+'</div>';
  document.getElementById('quit').onclick=function(){VOICE.stop()};
  document.getElementById('bLang').onclick=function(){VOICE.stop();startScreen()};
  var b=document.getElementById('bSnd');
  if(b)b.onclick=function(){sound=!sound;if(!sound)VOICE.stop();b.textContent=sound?'🔊':'🔇'};
}

/* ---------- Écrans ---------- */
function startScreen(){
  document.documentElement.lang='fr';
  header();
  app.innerHTML='<div class="card"><div class="animal">🦊</div><h1>Quiz des Animaux<br><small style="color:#6c5ce7">Animal Quiz</small></h1>'+
   '<p>Choisis ta langue · Choose your language</p>'+
   '<div class="langs"><button class="btn big" id="lFr" type="button">Français<span class="sm">Jouer en français</span></button>'+
   '<button class="btn big green" id="lEn" type="button">English<span class="sm">Play in English</span></button></div></div>';
  document.getElementById('lFr').onclick=function(){choose('fr')};
  document.getElementById('lEn').onclick=function(){choose('en')};
}
function choose(l){
  lang=l;document.documentElement.lang=l;
  VOICE.unlock();
  introScreen();
}
function introScreen(){
  var t=T[lang];header();
  var cards=[['carn','🥩'],['herb','🌿'],['omn','🍽️']].map(function(k){
    var d=DIETS[k[0]];
    return '<div><span class="e">'+d.e+'</span><b>'+cap(d[lang])+'</b>'+(lang==='fr'?d.sfr:d.sen)+'</div>';
  }).join('');
  app.innerHTML='<div class="card"><div class="animal">🦁</div><h1>'+t.title+'</h1><h2>'+t.introH+'</h2><div class="intro">'+cards+'</div>'+
   '<div class="row"><button class="btn big green" id="go" type="button">▶ '+t.play+'</button>'+
   '<button class="btn light" id="re" type="button">🔊 '+t.replay+'</button></div>'+
   (VOICE.ok?'':'<p class="note">'+t.noVoice+'</p>')+'</div>';
  document.getElementById('go').onclick=newGame;
  document.getElementById('re').onclick=function(){say(t.introSpeak)};
  say(t.introSpeak);
}
function newGame(){
  var g=function(k){return shuffle(ANIMALS.filter(function(a){return a.grp===k}))};
  var sel=g('omn').slice(0,2).concat(g('herb').slice(0,4),g('carn').slice(0,4));
  Q=shuffle(sel).map(function(a){
    var type=(a.diet&&a.food)?(Math.random()<0.5?'diet':'food'):(a.diet?'diet':'food');
    return {a:a,t:type};
  });
  qi=0;pts=0;results=[];
  showQ();
}
function buildOpts(q){
  if(q.t==='diet'){
    return ['carn','herb','omn'].map(function(k){
      var d=DIETS[k];
      return {key:k,e:d.e,label:cap(d[lang]),sub:lang==='fr'?d.sfr:d.sen,ok:k===q.a.diet};
    });
  }
  var correct=q.a.food,want=FOODS[correct].t==='p'?'m':'p';
  var others=shuffle(Object.keys(FOODS).filter(function(k){return FOODS[k].t===want})).slice(0,2);
  return shuffle([correct].concat(others)).map(function(k){
    var f=FOODS[k];
    return {key:k,e:f.e,label:cap(f[lang]),sub:'',ok:k===correct};
  });
}
function qText(q){return q.t==='diet'?T[lang].qDiet(q.a):T[lang].qFood(q.a)}
function showQ(){
  var t=T[lang],q=Q[qi];header();
  q.opts=buildOpts(q);
  var dots=Q.map(function(_,i){return '<span class="dot '+(i<qi?(results[i]?'ok':'ko'):(i===qi?'now':''))+'"></span>'}).join('');
  var opts=q.opts.map(function(o,i){
    return '<button class="opt" type="button" data-i="'+i+'"><span class="e">'+o.e+'</span>'+o.label+(o.sub?'<span class="s">'+o.sub+'</span>':'')+'</button>';
  }).join('');
  app.innerHTML='<div class="card"><div class="dots">'+dots+'</div><div class="animal">'+q.a.e+'</div>'+
   '<div class="q"><p>'+qText(q)+'</p><button class="btn light small" id="re" type="button" aria-label="'+t.replay+'">🔊</button></div>'+
   '<div class="opts">'+opts+'</div><div id="fb"></div></div>';
  var bs=app.querySelectorAll('.opt');
  for(var i=0;i<bs.length;i++)bs[i].onclick=function(){answer(+this.getAttribute('data-i'))};
  document.getElementById('re').onclick=readQ;
  cur={answered:false};
  readQ();
}
function readQ(){
  var q=Q[qi],list=[qText(q)];
  q.opts.forEach(function(o){list.push(o.label)});
  say(list);
}
function answer(i){
  if(cur.answered)return;cur.answered=true;
  var t=T[lang],q=Q[qi],o=q.opts[i],good=o.ok;
  var right=q.opts.filter(function(x){return x.ok})[0];
  var sentence=q.t==='diet'?t.dietSentence(q.a,q.a.diet):t.foodSentence(q.a,q.a.food);
  var fact=q.a.fact?q.a.fact[lang]:'';
  results[qi]=good;if(good)pts+=10;
  var bs=app.querySelectorAll('.opt');
  for(var k=0;k<bs.length;k++){
    bs[k].classList.add('off');
    if(q.opts[k].ok)bs[k].classList.add('right');
    else if(k===i)bs[k].classList.add('wrong');
  }
  var head=good?t.praise[Math.floor(Math.random()*t.praise.length)]:t.oops;
  var shown=(good?'✅ ':'❌ ')+head+' '+(good?'':t.right+' ')+sentence;
  var sp=[head];if(!good)sp.push(t.right);sp.push(sentence);if(fact)sp.push(fact);
  var last=qi===Q.length-1;
  document.getElementById('fb').innerHTML='<div class="fb '+(good?'good':'bad')+'">'+shown+(fact?'<span class="fact">💡 '+written(fact)+'</span>':'')+'</div>'+
    '<div class="row"><button class="btn big green" id="nx" type="button">'+(last?'🏆 '+t.last:t.next+' ▶')+'</button></div>';
  document.getElementById('nx').onclick=function(){VOICE.stop();if(last)endScreen();else{qi++;showQ()}};
  document.getElementById('nx').scrollIntoView({behavior:'smooth',block:'nearest'});
  if(good){beep([660,880,1100]);confetti()}else beep([300,220]);
  say(sp);
}
function endScreen(){
  var t=T[lang];header();
  var lvl=pts>=90?2:(pts>=60?1:0);
  var stars=pts>=90?'⭐⭐⭐':(pts>=60?'⭐⭐☆':(pts>=30?'⭐☆☆':'☆☆☆'));
  var line=t.scoreLine(pts);if(lang==='fr')line=line.replace(/^Tu as (.*) points/,function(m,w){return 'Tu as '+w+' points'});
  app.innerHTML='<div class="card"><div class="animal">'+(lvl===2?'🏆':(lvl===1?'🎉':'🐾'))+'</div>'+
   '<p class="score">'+pts+' / 100</p><div class="stars">'+stars+'</div>'+
   '<h2>'+line+'</h2><p>'+t.end[lvl]+'</p>'+
   '<div class="row"><button class="btn big green" id="ag" type="button">🔁 '+t.again+'</button>'+
   '<button class="btn light" id="re" type="button">🔊 '+t.replay+'</button>'+
   '<a class="btn quit big" href="../index.html">✖ '+t.quit+'</a></div></div>';
  document.getElementById('ag').onclick=newGame;
  var sp=[t.scoreLine(pts),t.end[lvl]];
  document.getElementById('re').onclick=function(){say(sp)};
  if(lvl>0)confetti();
  beep(lvl>0?[523,659,784,1046]:[392,330]);
  say(sp);
}

startScreen();
</script>
</body>
